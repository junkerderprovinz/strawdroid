name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - ".github/assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/assets/**"
  workflow_dispatch:

permissions:
  contents: write   # release asset upload
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and publish (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The image is around 9 GB, which with the build cache does not fit on a
      # stock runner, and a full disk fails late and looks like a broken
      # download.
      - name: Make room on the runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h / | tail -1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # No push from a pull request: a fork PR gets no secrets, and unreviewed
      # code should not be published even when it could be.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Docker Hub mirror joins once the DOCKERHUB_USERNAME variable and the
      # DOCKERHUB_TOKEN secret are both set; until then the run publishes to
      # GHCR alone.
      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` moves only for a tag build, and only when that tag is the highest
      # version in the repo: the first keeps an unreleased merge to main away from
      # everyone who pulls `latest`, the second keeps a re-cut of an older tag from
      # dragging `latest` backwards. checkout fetches no tags, hence the fetch.
      - name: Is this the newest release tag?
        id: newest
        if: github.ref_type == 'tag'
        run: |
          git fetch --tags --force --quiet
          newest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          echo "this tag: ${GITHUB_REF_NAME}"
          echo "newest:   ${newest}"
          if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
            echo "is_newest=true" >> "$GITHUB_OUTPUT"
            echo "-> this build moves :latest"
          else
            echo "is_newest=false" >> "$GITHUB_OUTPUT"
            echo "-> this build leaves :latest where it is"
          fi

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # `latest` is the newest released version; the tip of main answers to
          # `edge`.
          tags: |
            type=sha,format=short
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.newest.outputs.is_newest == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # amd64 only: the emulator runs an x86_64 system image under KVM, which an
      # arm64 build could not.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The README's download buttons point at releases/latest/download/. A
      # release asset is served with Content-Disposition: attachment and
      # downloads, where a raw file in the repo would open as text/plain in a tab.
      - name: Attach the downloads to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            docker-compose.yml \
            scripts/start-windows.ps1 \
            scripts/start-linux.sh \
            --clobber

      - name: Say where it went
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

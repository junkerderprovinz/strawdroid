name: Build

# Builds the image and publishes it, so the thing the README describes can
# actually be obtained. Until 2026-09-13 it could not: the image existed only
# as a locally built layer on one server, which makes every install
# instruction in this repo a description of something nobody else has.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - ".github/assets/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - ".github/assets/**"
  workflow_dispatch:

permissions:
  contents: write   # release asset upload
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and publish (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The finished image is around 9 GB: a JDK, the Android SDK, the emulator
      # and a full system image on top of the Selkies base. A stock runner does
      # not have room for that plus the build cache, and the failure arrives
      # late and reads as a broken download rather than a full disk.
      - name: Make room on the runner
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          df -h / | tail -1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # Push only on main, tags and manual runs, never from a pull request: a
      # fork PR gets no secrets, and a push from unreviewed code is not wanted
      # even when it would work.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror, active only once DOCKERHUB_USERNAME (variable) and
      # DOCKERHUB_TOKEN (secret) are set together. Without them the run stays
      # green and publishes to GHCR alone, so the mirror can be switched on
      # later without touching this file.
      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.IMAGE }}
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }},enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # `latest` comes from a BRANCH build only, never from a tag build.
          # `{{is_default_branch}}` reads like it means that and does not:
          # metadata-action counts a tag on the default branch as the default
          # branch, so every tag build would push `latest` too. Harmless while
          # tags only move forward, and wrong the day an older version is
          # re-cut. main is at or ahead of the newest tag when a release is
          # made, so `latest` still tracks the newest code.
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # amd64 only, and that is not a shortcut. The emulator runs an x86_64
      # Android system image with KVM; an arm64 build would have nothing to run
      # on it and would quietly suggest otherwise by existing.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The download button in the README points at
      # releases/latest/download/docker-compose.yml, and that URL only resolves
      # if the file is a release ASSET. A raw file in the repo would open as
      # text in a tab instead of downloading, because raw.githubusercontent.com
      # serves it as text/plain; a release asset carries
      # Content-Disposition: attachment and therefore actually downloads.
      # Built on every run rather than only on tags, so a change that breaks
      # the launcher is caught by the ordinary build instead of surfacing on
      # the day of a release.
      - name: Build the launcher
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5
        with:
          go-version: "1.23"
          # go.mod, not go.sum: the launcher has no dependencies, so no go.sum
          # is written, and setup-go fails outright on a cache path that does
          # not exist.
          cache-dependency-path: launcher/go.mod

      - name: Cross-compile the launcher
        run: |
          cd launcher
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "gofmt"; exit 1; }
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o ../strawknight-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o ../strawknight-linux-amd64 .
          cd ..
          # Checksums, because the binaries are unsigned: somebody who wants to
          # know they got what CI built has no other way to check.
          sha256sum strawknight-windows-amd64.exe strawknight-linux-amd64 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach the downloads to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            docker-compose.yml \
            strawknight-windows-amd64.exe \
            strawknight-linux-amd64 \
            SHA256SUMS.txt \
            scripts/start-windows.ps1 \
            scripts/start-linux.sh \
            --clobber

      - name: Say where it went
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

# StrawDroid, ready to run.
#
#   docker compose up -d
#
# Then open https://<this-host>:3001/ and accept the self-signed certificate
# once. From a development machine: adb connect <this-host>:5555

services:
  strawdroid:
    image: ghcr.io/junkerderprovinz/strawdroid:latest
    container_name: StrawDroid

    # Without KVM the emulator does not start, and the container log says so.
    devices:
      - /dev/kvm
      # Intel or AMD graphics: the emulator draws on the GPU instead of the CPU.
      # - /dev/dri
    # NVIDIA instead needs the nvidia container toolkit and these two:
    # runtime: nvidia
    # and NVIDIA_VISIBLE_DEVICES: "all" under environment.

    # PUID and PGID must match the owner of ./config on the host, or the
    # emulator cannot write into its AVD and reports "A snapshot operation is
    # pending and timeout has expired".
    #
    # 99:100 is Unraid's nobody:users. On a plain Linux box, use your own:
    #   id -u  /  id -g
    environment:
      PUID: "99"
      PGID: "100"
      TZ: "Europe/Vienna"
      # auto uses a GPU when one is wired in (see below) and the CPU otherwise.
      EMULATOR_GPU: "auto"
      EMULATOR_DEVICE: "pixel_6"
      EMULATOR_RAM: "2048"

    ports:
      - "3001:3001"   # the desktop, over HTTPS
      - "5555:5555"   # adb

    volumes:
      # The AVD with its installed apps and granted permissions; without it
      # every restart is a factory reset.
      - ./config:/config
      # Optional, read-only. An APK dropped in here shows up on the device
      # under Download/share, so it can be installed by tapping it.
      # - /path/to/downloads:/share:ro

    shm_size: "2gb"

    # The emulator holds about 6 GB even idle with no app installed.
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g

    # Because of that memory it is started when needed rather than kept up
    # with "unless-stopped".
    restart: "no"
